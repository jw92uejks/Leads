version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    hostname: mysql
    networks:
      - local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mercado

volumes:
  mysql_data:
    name: mysql

networks:
  local:
    external: true
    name: local