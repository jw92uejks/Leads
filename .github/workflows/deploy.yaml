name: CI/CD Deploy Private Repo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            if [ ! -d "/var/www/mercadodeleads/.git" ]; then
              echo "Pasta não existe ou não é um repo git. Clonando..."
              git clone git@github.com:Corvaum/mercadodeleads.git /var/www/mercadodeleads
            else
              echo "Repo já existe. Atualizando..."
              cd /var/www/mercadodeleads
              git pull origin main
            fi

            # cd /var/www/mercadodeleads
            # composer install --no-dev
            # php artisan migrate --force
            # php artisan optimize
