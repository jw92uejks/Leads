name: CI/CD Deploy Private Repo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Configura SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # Deploy via SSH no servidor
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: git
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Cria pasta se não existir
            mkdir -p /var/www/snakegame
            cd /var/www/snakegame

            # Adiciona GitHub ao known_hosts (por segurança)
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            # Se não for um repo git, limpa a pasta e clona
            if [ ! -d ".git" ]; then
              echo "Pasta não existe ou não é um repo git. Limpando e clonando..."
              rm -rf /var/www/snakegame/*
              git clone git@github.com:LM-OnDeal/mercadodeleads.git .
            else
              echo "Repo já existe. Atualizando..."
              git pull origin main
            fi

            # Scripts PHP comentados (descomente quando estiver pronto)
            # cd /var/www/snakegame
            # composer install --no-dev
            # php artisan migrate --force
            # php artisan optimize
