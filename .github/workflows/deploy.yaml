name: CI/CD Deploy Private Repo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Deploy via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Se a pasta não existir, cria e clona o repo
            if [ ! -d "/var/www/mercadodeleads/.git" ]; then
              echo "Pasta não existe, criando e clonando repo..."
              mkdir -p /var/www/mercadodeleads
              cd /var/www/mercadodeleads
              git clone git@github.com:Corvaum/mercadodeleads.git .
            else
              echo "Repo já existe. Atualizando..."
              cd /var/www/mercadodeleads
              git pull origin main
            fi

            # php scripts (comentados por enquanto)
            # cd /var/www/mercadodeleads
            # composer install --no-dev
            # php artisan migrate --force
            # php artisan optimize
